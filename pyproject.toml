[project]
name = "visual-similarity-engine"
version = "0.1.0"
description = "Serviço de IA do Simila: embeddings CLIP, busca de imagens semelhantes (pgvector) e categorias por k-means"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aio-pika==10.2.1",
    "alembic==1.20.1",
    "clip",
    "fastapi[standard]==0.162.0",
    "ftfy==6.3.1",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "pgvector==0.5.1",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "regex==2026.9.29",
    "scikit-learn==1.9.1",
    "sqlalchemy[asyncio]==2.1.6",
    "torch==2.15.0",
    "torchvision==0.29.2",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
]

[tool.fastapi]
entrypoint = "app.main:app"

# CLIP oficial da OpenAI (não está no PyPI) e torch só CPU: a imagem fica ~1,5 GB menor sem CUDA
[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP", rev = "d05afc436d78f1c48dc0dbf8e5980a9d471f35f6" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# A pasta alembic/ (migrações) faria o ruff achar que o pacote alembic é do projeto
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clip", "clip.*", "sklearn.*", "pgvector.*", "aio_pika.*", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["clip: carrega o modelo CLIP (download de ~340 MB na primeira vez)"]
# O clip.load tenta o arquivo TorchScript antes de cair no state_dict (jit=False); o aviso é inofensivo
filterwarnings = ["ignore:`torch.jit.load` is not supported:FutureWarning"]
